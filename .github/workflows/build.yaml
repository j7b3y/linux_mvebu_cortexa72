name: Build Kernel

on:
  push:
    paths:
      - 'linux/**'
  workflow_dispatch:

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          crossbuild-essential-arm64 \
          debhelper \
          bc \
          bison \
          flex \
          libssl-dev \
          libssl-dev:arm64 \
          libelf-dev \
          libdw-dev \
          pahole

    - name: Building Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        cd linux
        date "+%Y%m%d%H%M%S" > .version
        make mvebu_defconfig
        make olddefconfig
        make --jobs=$(nproc) bindeb-pkg
        cd ..
        mkdir output
        mv *.deb ./output/

    - uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: ./output/*.deb
